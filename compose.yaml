name: morydeals-crawler
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: morydeals
      POSTGRES_USER: morydeals
      POSTGRES_PASSWORD: local-morydeals
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morydeals -d morydeals"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  camoufox:
    profiles: [browser]
    build:
      context: .
      dockerfile: apps/browser-service/Dockerfile
    ports: ["127.0.0.1:59222:9222"]
    shm_size: 1gb
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9223').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
